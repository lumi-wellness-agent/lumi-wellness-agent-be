[project]
name = "lumi-wellness-agent-be"
version = "0.1.0"
description = "심리학 이론·임상/실험 연구 Reference 기반 AI 웰니스 에이전트 LUMI의 FastAPI 서버"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    # Supabase Postgres 접속. pgvector는 vector 타입을 psycopg에 등록한다(app/db.py)
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.4",
    # 세션 그래프(app/agent/graph.py): 순환·분기·interrupt와 체크포인트
    "langgraph>=1.2",
    # Planner 에이전트(create_agent·Tool·구조화 출력). 모델 공급자 패키지는 정하면 추가한다
    "langchain>=1.4",
]

[project.optional-dependencies]
dev = [
    # FastAPI TestClient가 쓴다
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
