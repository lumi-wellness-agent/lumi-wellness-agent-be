[project]
name = "lumi-wellness-agent-be"
version = "0.1.0"
description = "심리학 이론·임상/실험 연구 Reference 기반 AI 웰니스 에이전트 LUMI의 FastAPI 서버"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    # Supabase Postgres 접속. pgvector는 vector 타입을 psycopg에 등록한다(app/db.py)
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.4",
    # 세션 그래프(app/agent/graph.py): 순환·분기·interrupt와 체크포인트
    "langgraph>=1.2",
    # 세션 상태를 Supabase Postgres에 저장하는 체크포인터(app/agent/checkpoint.py)
    "langgraph-checkpoint-postgres>=3.2",
    # Planner 에이전트(create_agent·Tool·구조화 출력)
    "langchain>=1.4",
    # intake·plan의 모델 공급자(app/agent/assembly.py). 1순위 OpenAI(LLM_MODEL, 기본 gpt-4o-mini),
    # 폴백 Anthropic(FALLBACK_MODEL, 기본 claude-haiku-5-5). 재시도·폴백 규칙은 app/agent/llm.py
    "langchain-openai>=1.7",
    "langchain-anthropic>=1.7",
    # A 콘텐츠 공급자(Pixabay · Freesound · AI Horde · Art Institute) HTTP 호출
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
# Offline 근거 구축(app/ingestion). 서버 패키지에는 넣지 않는다 — 적재는 로컬에서 돌린다
ingestion = [
    "docling>=2.0",
    # 근거 추출(LLM)·임베딩(text-embedding-3-small) 모두 OpenAI 키 하나로
    "openai>=1.0",
    "openpyxl>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# Vercel이 함수 하나로 올리는 FastAPI 앱(README '배포'). app/main.py는 자동 인식되지만 경로를 고정해 둔다
[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
