<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PR-11</title><style>body{font-family:system-ui;max-width:720px;margin:auto;padding:24px;background:#f3f5f1;color:#203438}.card{background:#fff;padding:24px;border-radius:16px;margin:12px 0}.hidden{display:none}button{padding:11px 16px;margin:5px;border:0;border-radius:8px;background:#397d78;color:#fff}button:disabled{background:#9aa7a5}.muted{color:#607277}.time{font-size:4rem;text-align:center}.progress{height:10px;background:#ddd}.progress i{display:block;background:#397d78;height:100%;width:0}.popup{background:#eef5f2;padding:14px;margin-top:12px}.json{white-space:pre-wrap;background:#182427;color:#fff;padding:14px}.error{color:#a33}</style></head><body>
<p id="loadStatus">Loading JSON configuration...</p><section id="intro" class="card hidden"><h1 id="title"></h1><p id="meta" class="muted"></p><p id="summary"></p><p id="introGuide"></p><h3>시작 전 확인</h3><label><input type="checkbox" data-check="walking_environment"> 현재 보행할 장소와 경로가 충분히 안전합니다.</label><br><label><input type="checkbox" data-check="body_condition"> 현재 몸 상태로 이 활동을 진행할 수 있습니다.</label><p class="muted">이 확인은 사용자의 자기확인입니다.</p><button id="start" disabled>시작</button></section>
<section id="activity" class="card hidden"><h1>야외 자연 보행</h1><p id="guide" class="muted"></p><div id="elapsed" class="time">00:00</div><p>진행률: <b id="percent">0%</b> · 남은 시간: <b id="remaining">00:00</b></p><div class="progress"><i id="bar"></i></div><button id="pause">일시정지</button><button id="endAction">중단</button><p id="timerStatus"></p><div id="pausePopup" class="popup hidden">활동이 일시정지되었습니다. 계속하려면 재개 버튼을 눌러주세요.<br><button id="resume">재개</button></div><div id="stopPopup" class="popup hidden"><p id="stopText"></p><label><input type="radio" name="stopReason" value="SAFETY"> 안전</label><label><input type="radio" name="stopReason" value="DISCOMFORT"> 불편</label><br><button id="cancelStop">계속하기</button><button id="confirmStop" disabled>중단하기</button></div></section>
<section id="result" class="card hidden"><h1>활동 결과</h1><div id="summaryResult"></div><p id="limitation" class="muted"></p><button id="newActivity">다시 시작</button><pre id="json" class="json" hidden></pre></section>
<script>
const KEY='lumi.pr11.outdoor.v1';let protocol,runtime,example,state,config;const $=id=>document.getElementById(id),fmt=s=>{s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function item(slot){return protocol.content_spec?.slots?.find(x=>x.slot===slot)}function text(slot){const x=item(slot);if(!x){if(runtime.content_validation.required_slots.includes(slot))throw Error(runtime.content_validation.error_text);console.warn('PR-11 optional content slot missing',{slot});return ''}if(x.text||x.fallback_text)return x.text||x.fallback_text;console.warn('PR-11 optional content slot empty',{slot});return ''}function speak(slot){const x=item(slot),t=text(slot);if(!t||x?.source_policy?.tts!=='ALLOWED')return;if(!('speechSynthesis'in window)){console.warn('PR-11 TTS unavailable',{slot,reason:'browser_policy_or_unsupported'});return}try{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}catch(e){console.warn('PR-11 TTS failed',{slot,reason:e?.message||'synthesis_error'})}}
function validate(){for(const s of runtime.content_validation.required_slots){const x=item(s);if(!x||(!x.text&&!x.fallback_text))throw Error(runtime.content_validation.error_text)}}async function boot(){try{[protocol,runtime,example]=await Promise.all(['PR-11.proposed.json','pr11-runtime.json','pr11-result.example.json'].map(x=>fetch(x).then(r=>{if(!r.ok)throw Error(x);return r.json()})));validate();const o=runtime.duration_input.default;config={option:o,duration:runtime.duration_options[o].planned_seconds};buildIntro();state=load()||{phase:'intro'};render()}catch(e){$('loadStatus').textContent=e.message||'안내 문구를 불러오지 못했습니다. 활동을 시작하지 말고 잠시 후 다시 시도해 주세요.';$('loadStatus').className='error'}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s?.phase==='active'){s.elapsedSec=s.elapsedSec+(Date.now()-s.startedAt)/1000;s.startedAt=null;s.phase='paused';s.timer_status='PAUSED';s.resume_required=true;s.phase_history.push({event:'PAUSED',at:new Date().toISOString()});localStorage.setItem(KEY,JSON.stringify(s))}return s}catch{return null}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function add(event){state.phase_history.push({event,at:new Date().toISOString()})}
function buildIntro(){$('title').textContent=protocol.name;$('meta').textContent='Activity ID: '+protocol.protocol_id+' · Recommended: '+protocol.duration_minutes.default+' min';$('summary').textContent=protocol.summary||'';$('introGuide').textContent=text('INTRO_GUIDE');document.querySelectorAll('[data-check]').forEach(x=>x.onchange=()=>{$('start').disabled=[...document.querySelectorAll('[data-check]')].some(y=>!y.checked)});$('start').onclick=start}
function current(){return state.target_reached?state.elapsedSec:state.phase==='active'?state.elapsedSec+(Date.now()-state.startedAt)/1000:state.elapsedSec}function render(){const screen=['active','paused'].includes(state.phase)?'activity':state.phase;['intro','activity','result'].forEach(x=>$(x).classList.toggle('hidden',x!==screen));if(screen==='activity')update();$('pausePopup').classList.toggle('hidden',state.phase!=='paused')}
function start(){state={phase:'active',timer_status:'RUNNING',selected_duration_option:config.option,durationSec:config.duration,elapsedSec:0,startedAt:Date.now(),target_reached:false,target_tts_shown:false,early_stopped:false,pause_count:0,pre_activity_check:{walking_environment:true,body_condition:true},phase_history:[{event:'PRE_ACTIVITY_CHECK_CONFIRMED',at:new Date().toISOString()},{event:'ACTIVITY_STARTED',at:new Date().toISOString()}]};save();render();speak('INTRO_GUIDE')}
function update(){const e=current(),reached=e>=state.durationSec;if(reached&&!state.target_reached){state.target_reached=true;state.elapsedSec=state.durationSec;state.startedAt=null;add('TARGET_REACHED');save();speak('TARGET_REACHED_GUIDE')}const p=Math.min(100,state.elapsedSec/state.durationSec*100);$('guide').textContent=text('DURING_ACTIVITY_GUIDE');$('timerStatus').textContent=state.target_reached?text('TARGET_REACHED_GUIDE'):state.phase==='paused'?'일시정지됨':'';$('elapsed').textContent=fmt(state.elapsedSec);$('remaining').textContent=fmt(Math.max(0,state.durationSec-state.elapsedSec));$('percent').textContent=Math.round(p)+'%';$('bar').style.width=p+'%';$('endAction').textContent=state.target_reached?'완료':'중단';$('pause').disabled=state.target_reached}
function toggle(){if(state.phase==='active'){state.elapsedSec=current();state.startedAt=null;state.phase='paused';state.timer_status='PAUSED';state.pause_count++;add('PAUSED')}else if(state.phase==='paused'){state.phase='active';state.timer_status='RUNNING';state.startedAt=Date.now();add('RESUMED')}save();render()}function complete(){state.phase='result';state.timer_status='STOPPED';state.completion={status:'COMPLETED',user_action:'DONE_BUTTON',confirmed:true};state.recordedAt=new Date().toISOString();add('COMPLETED');save();render()}function openStop(){if(state.target_reached)return;$('stopText').textContent=text('STOP_CONFIRMATION');$('stopPopup').classList.remove('hidden');$('confirmStop').disabled=true}function stop(){const r=document.querySelector('input[name=stopReason]:checked');if(!r)return;state.phase='result';state.timer_status='STOPPED';state.early_stopped=true;state.stop_reason=r.value;state.completion={status:'STOPPED',user_action:'STOP_BUTTON',confirmed:true};state.recordedAt=new Date().toISOString();add('STOPPED');save();render()}
function showResult(){const ok=state.completion.status==='COMPLETED';const record={record_schema_version:example.record_schema_version,protocol_id:'PR-11',selected_duration_option:state.selected_duration_option,pre_activity_check:state.pre_activity_check,phase_history:state.phase_history,terminal_phase:ok?'COMPLETED':'STOPPED',timer:{planned_seconds:state.durationSec,elapsed_seconds:state.elapsedSec,normal_time_end:ok,early_stopped:!!state.early_stopped,target_reached:!!state.target_reached,timer_status:'STOPPED',pause_count:state.pause_count},completion:state.completion,verification:{automatic_walking:'not_performed',gps:'disabled',self_report_basis:false},step_tracking:{status:'not_measured',estimated_steps:null,confidence:null},stop_reason:state.stop_reason||null};$('summaryResult').textContent='목표 달성 여부: '+(state.target_reached?'달성':'미달성');$('limitation').textContent=text('LIMITATION_NOTICE');$('json').textContent=JSON.stringify(record,null,2)}
$('pause').onclick=toggle;$('resume').onclick=toggle;$('endAction').onclick=()=>state.target_reached?complete():openStop();$('cancelStop').onclick=()=>{$('stopPopup').classList.add('hidden')};document.querySelectorAll('input[name=stopReason]').forEach(x=>x.onchange=()=>{$('confirmStop').disabled=false});$('confirmStop').onclick=stop;$('newActivity').onclick=()=>{localStorage.removeItem(KEY);location.reload()};setInterval(()=>{if(state?.phase==='active')update()},500);boot();</script></body></html>
