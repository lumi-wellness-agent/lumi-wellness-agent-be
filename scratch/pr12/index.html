<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PR-12</title><style>body{font-family:system-ui;max-width:760px;margin:auto;padding:24px;background:#f3f5f1;color:#203438}.card{background:#fff;padding:24px;border-radius:16px;margin:12px 0}.hidden{display:none}button{padding:11px 16px;margin:5px;border:0;border-radius:8px;background:#397d78;color:#fff}button:disabled{background:#9aa7a5}.muted{color:#607277}.time{font-size:4rem;text-align:center}.progress{height:10px;background:#ddd}.progress i{display:block;background:#397d78;height:100%;width:0}.popup{background:#eef5f2;padding:14px;margin-top:12px}.error{color:#a33}</style></head><body>
<p id="loadStatus">Loading JSON configuration...</p><section id="intro" class="card hidden"><h1 id="title"></h1><p id="meta" class="muted"></p><p id="summary"></p><p id="introGuide"></p><label><input type="checkbox" data-check="walking_environment"> 현재 보행할 장소와 경로가 충분히 안전합니다.</label><br><label><input type="checkbox" data-check="body_condition"> 현재 몸 상태로 이 활동을 진행할 수 있습니다.</label><p class="muted">이 확인은 사용자의 자기확인입니다.</p><button id="start" disabled>시작</button></section>
<section id="activity" class="card hidden"><h1>자연 속 걷기</h1><p id="guide" class="muted"></p><div id="elapsed" class="time">00:00</div><p>진행률: <b id="percent">0%</b> · 남은 시간: <b id="remaining">00:00</b></p><div class="progress"><i id="bar"></i></div><button id="pause">일시정지</button><button id="endAction">중단</button><p id="timerStatus"></p><div id="pausePopup" class="popup hidden">활동이 일시정지되었습니다. 계속하려면 재개 버튼을 눌러주세요.<br><button id="resume">재개</button></div><div id="stopPopup" class="popup hidden"><p id="stopText"></p><label><input type="radio" name="stopReason" value="SAFETY"> 안전</label><label><input type="radio" name="stopReason" value="DISCOMFORT"> 불편</label><br><button id="cancelStop">계속하기</button><button id="confirmStop" disabled>중단하기</button></div></section>
<section id="noticing" class="card hidden"><h1>알아차린 좋은 것 기록</h1><p id="noticingPrompt"></p><div id="fields"></div><button id="saveNoticing">완료</button></section>
<section id="result" class="card hidden"><h1>활동 결과</h1><p id="summaryResult"></p><p id="limitation" class="muted"></p><button id="newActivity">다시 시작</button></section>
<script>
const KEY='lumi.pr12.noticing.v1';let protocol,runtime,example,state,config;const $=id=>document.getElementById(id),fmt=s=>{s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function slot(n){return protocol.content_spec?.slots?.find(x=>x.slot===n)}function text(n){const x=slot(n);if(!x){if(runtime.content_validation.required_slots.includes(n))throw Error(runtime.content_validation.error_text);console.warn('PR-12 optional content slot missing',{slot:n});return''}return x.text||x.fallback_text||''}function speak(t){if(!t)return;if(!('speechSynthesis'in window)){console.warn('PR-12 TTS unavailable',{reason:'browser_policy_or_unsupported'});return}try{speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(t))}catch(e){console.warn('PR-12 TTS failed',{reason:e?.message||'synthesis_error'})}}
function validate(){for(const n of runtime.content_validation.required_slots){const x=slot(n);if(!x||(!x.text&&!x.fallback_text))throw Error(runtime.content_validation.error_text)}}async function boot(){try{[protocol,runtime,example]=await Promise.all(['PR-12.proposed.json','pr12-runtime.json','pr12-result.example.json'].map(x=>fetch(x).then(r=>r.json())));validate();config=runtime.duration_input.options[runtime.duration_input.default];buildIntro();state=load()||{phase:'intro'};render()}catch(e){$('loadStatus').textContent=e.message||runtime?.content_validation?.error_text||'안내 문구 오류';$('loadStatus').className='error'}}
function load(){try{return JSON.parse(localStorage.getItem(KEY))}catch{return null}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function add(event){state.phase_history.push({event,at:new Date().toISOString()})}function current(){return state.target_reached?state.elapsedSec:state.phase==='active'?state.elapsedSec+(Date.now()-state.startedAt)/1000:state.elapsedSec}
function buildIntro(){$('title').textContent=protocol.name;$('meta').textContent='PR-12 · 30분';$('summary').textContent=protocol.summary||'';$('introGuide').textContent=text('INTRO_GUIDE');const l=runtime.safety_check.labels||{};document.querySelector('[data-check="walking_environment"]').parentElement.lastChild.textContent=' '+(l.walking_environment||'현재 보행할 장소와 경로가 충분히 안전합니다.');document.querySelector('[data-check="body_condition"]').parentElement.lastChild.textContent=' '+(l.body_condition||'현재 몸 상태로 이 활동을 진행할 수 있습니다.');document.querySelectorAll('[data-check]').forEach(x=>x.onchange=()=>{$('start').disabled=[...document.querySelectorAll('[data-check]')].some(y=>!y.checked)});$('start').onclick=start}
function render(){['intro','activity','noticing','result'].forEach(x=>$(x).classList.toggle('hidden',x!==state.phase));if(state.phase==='active'||state.phase==='paused')update();$('pausePopup').classList.toggle('hidden',state.phase!=='paused')}
function start(){state={phase:'active',timer_status:'RUNNING',selected_duration_option:'PR12-30',durationSec:config.planned_seconds,elapsedSec:0,startedAt:Date.now(),target_reached:false,early_stopped:false,pause_count:0,phase_history:[{event:'PRE_ACTIVITY_CHECK_CONFIRMED',at:new Date().toISOString()},{event:'ACTIVITY_STARTED',at:new Date().toISOString()}],noticing:[]};save();render();speak(runtime.voice_guide.milestones['0'])}
function update(){const e=current(),p=Math.min(100,e/state.durationSec*100),milestone=[0,25,50,75,100].find(x=>p>=x&&!state.voicePlayed?.includes(x));if(milestone!==undefined){state.voicePlayed=state.voicePlayed||[];state.voicePlayed.push(milestone);if(milestone===100&&!state.target_reached){state.target_reached=true;state.elapsedSec=state.durationSec;state.startedAt=null;add('TARGET_REACHED');$('endAction').textContent='다음 단계';$('pause').disabled=true}$('guide').textContent=runtime.voice_guide.milestones[String(milestone)];speak(runtime.voice_guide.milestones[String(milestone)]);save()}$('elapsed').textContent=fmt(state.elapsedSec);$('remaining').textContent=fmt(Math.max(0,state.durationSec-state.elapsedSec));$('percent').textContent=Math.round(p)+'%';$('bar').style.width=p+'%';if(state.target_reached)$('timerStatus').textContent='보행이 끝났습니다. 다음 단계로 이동하세요.'}
function toggle(){if(state.phase==='active'){state.elapsedSec=current();state.startedAt=null;state.phase='paused';state.timer_status='PAUSED';state.pause_count++;if(!state.pause_recorded){add('PAUSED');state.pause_recorded=true}}else{state.phase='active';state.timer_status='RUNNING';state.startedAt=Date.now();add('RESUMED')}save();render()}function openStop(){if(state.target_reached)return;$('stopText').textContent=text('STOP_CONFIRMATION');$('stopPopup').classList.remove('hidden');$('confirmStop').disabled=true}function stop(){const r=document.querySelector('input[name=stopReason]:checked');if(!r)return;state.phase='result';state.timer_status='STOPPED';state.early_stopped=true;state.stop_reason=r.value;add('STOPPED');state.completion={walking_ended:false,noticing_completed:false,self_report_saved:false,wellness_completed:false};save();render()}
function openNoticing(){state.phase='noticing';state.timer_status='STOPPED';add('NOTICING_INPUT');$('noticingPrompt').textContent=text('NOTICING_PROMPT');$('fields').innerHTML=[0,1,2].map(i=>'<textarea id="n'+i+'" placeholder="좋았던 것을 기록해 보세요."></textarea>').join('<br>');render()}function saveNoticing(){const items=[0,1,2].map(i=>$("n"+i).value.trim()).filter(Boolean);if(!items.length){alert('한 가지 이상 기록해 주세요.');return}state.noticing=items;state.noticing_completed=true;state.phase='result';add('REPORT_STARTED');add('COMPLETED');state.completion={walking_ended:true,noticing_completed:true,self_report_saved:true,wellness_completed:true};save();render()}function showResult(){if(state.phase!=='result')return;$('summaryResult').textContent=state.completion?.wellness_completed?'활동 완료':'활동 중단';$('limitation').textContent=text('LIMITATION_NOTICE')}
function screen(){if(state.phase==='result')showResult()}$('pause').onclick=toggle;$('resume').onclick=toggle;$('endAction').onclick=()=>state.target_reached?openNoticing():openStop();$('cancelStop').onclick=()=>{$('stopPopup').classList.add('hidden')};document.querySelectorAll('input[name=stopReason]').forEach(x=>x.onchange=()=>{$('confirmStop').disabled=false});$('confirmStop').onclick=stop;$('saveNoticing').onclick=saveNoticing;$('newActivity').onclick=()=>{localStorage.removeItem(KEY);location.reload()};setInterval(()=>{if(state?.phase==='active')update()},500);boot();
</script><script>const _openNoticing=openNoticing;openNoticing=function(){if(!state.target_reached)return;if(!window.confirm('보행이 종료되었습니다. 알아차린 내용을 기록하는 다음 단계로 이동하시겠습니까?'))return;_openNoticing()};const _saveNoticing=saveNoticing;saveNoticing=function(){_saveNoticing();if(state?.noticing_completed){state.noticing_report_saved=true;save()}};$('endAction').onclick=()=>state.target_reached?openNoticing():openStop();</script></body></html>
