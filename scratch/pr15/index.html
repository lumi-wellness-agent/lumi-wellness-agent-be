<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PR-15 자연물 컬러링</title>
<style>body{font-family:system-ui,sans-serif;max-width:980px;margin:auto;padding:18px;background:#f5f4f0;color:#243238}.card{background:#fff;border-radius:14px;padding:18px;margin:12px 0}.palette{display:flex;gap:8px;flex-wrap:wrap}.swatch{width:42px;height:42px;border-radius:50%;border:3px solid transparent;cursor:pointer}.swatch[aria-pressed=true]{outline:3px solid #222;outline-offset:2px}.eraser{padding:8px 12px;border:2px solid #888;border-radius:8px;background:#fff;cursor:pointer}.eraser[aria-pressed=true]{outline:3px solid #222}.stage{background:#fff;border:1px solid #ccc;border-radius:12px;overflow:auto;max-height:70vh}.canvas{width:min(92vw,700px);margin:auto;padding:14px}.canvas svg{display:block;width:100%;height:auto}.region{cursor:pointer}.progress{height:10px;background:#ddd;border-radius:8px}.progress i{display:block;height:100%;background:#397d78;border-radius:8px;width:0}.muted{color:#59696d}.error{color:#a33}button{padding:10px 14px;border:1px solid #777;border-radius:7px;background:#fff;cursor:pointer}.primary{background:#397d78;color:#fff;border-color:#397d78}:disabled{opacity:.5;cursor:not-allowed}</style></head>
<body><main><section class="card"><h1>자연물 컬러링</h1><p>자연 도안의 흰색 영역을 원하는 색으로 천천히 색칠해 보세요. 검은 선은 색칠 영역이 아닙니다.</p><p class="muted">권장 시간은 약 5분이며 화면에는 타이머를 표시하지 않습니다.</p><div id="palette" class="palette"></div><button id="eraser" class="eraser" aria-pressed="false">지우개</button><p id="status">도안을 불러오는 중입니다.</p><p>색칠한 영역 <b id="colored">0</b> / <b id="total">0</b> · 남은 영역 <b id="remaining">0</b> · 완성률 <b id="percent">0%</b></p><div class="progress"><i id="bar"></i></div><button id="finish" class="primary" disabled>완료</button></section><section class="stage"><div id="canvas" class="canvas"></div></section></main>
<script>
const KEY='lumi.pr15.nature.v1', SVG_OPTIONS=['nature-1.svg','nature-3.svg','nature-5.svg','nature-6.svg','nature-7.svg'];
let SVG='assets/processed_images/'+(new URLSearchParams(location.search).get('design')||(()=>{try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d?.design)return d.design.split('/').pop()}catch(e){}return SVG_OPTIONS[Math.floor(Math.random()*SVG_OPTIONS.length)]})());
if(!new URLSearchParams(location.search).get('design')){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(!d?.design)localStorage.setItem(KEY,JSON.stringify({design:SVG, fills:{}, startedAt:null, done:false, updatedAt:new Date().toISOString()}))}catch(e){}}
const colors=[['Deep Teal','#397D78'],['Soft Blue','#759BC3'],['Muted Purple','#8873A6'],['Dusty Rose','#B86F87'],['Terracotta','#C48760'],['Soft Gold','#D4B85F'],['Olive Green','#89964E'],['Light Sand','#DFD1B5']];
let selected=colors[0][1], erasing=false, startedAt=null, saveTimer=null, done=false, fills={};
const $=id=>document.getElementById(id);
function renderPalette(){colors.forEach(([name,hex])=>{const b=document.createElement('button');b.className='swatch';b.title=name;b.style.background=hex;b.setAttribute('aria-label',name);b.setAttribute('aria-pressed',String(hex===selected));b.onclick=()=>{selected=hex;erasing=false;updateTools()};$('palette').append(b)});$('eraser').onclick=()=>{erasing=!erasing;updateTools()}}
function updateTools(){document.querySelectorAll('.swatch').forEach(b=>b.setAttribute('aria-pressed',String(b.style.backgroundColor===selected||b.style.background===selected)));$('eraser').setAttribute('aria-pressed',String(erasing))}
function loadDraft(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d){fills=d.fills||{};startedAt=d.startedAt||null;done=!!d.done}}catch(e){console.warn('draft restore failed',e)}}
function save(){clearTimeout(saveTimer);saveTimer=setTimeout(()=>{localStorage.setItem(KEY,JSON.stringify({design:SVG,fills,startedAt,done,updatedAt:new Date().toISOString()}))},500)}
function paint(el){const id=el.dataset.regionId;if(!id)return;if(!startedAt)startedAt=Date.now();const fill=erasing?'#FFFFFF':selected;el.setAttribute('fill',fill);if(fill==='#FFFFFF')delete fills[id];else fills[id]=fill;save();update()}
function update(){const all=[...document.querySelectorAll('[data-region-id]')];const colored=all.filter(x=>(x.getAttribute('fill')||'#FFFFFF').toUpperCase()!=='#FFFFFF').length;const total=all.length;const rem=total-colored;const pct=total?Math.round(colored/total*100):0;$('colored').textContent=colored;$('total').textContent=total;$('remaining').textContent=rem;$('percent').textContent=pct+'%';$('bar').style.width=pct+'%';$('finish').disabled=rem!==0;if(rem===0)$('status').textContent='모든 색칠 영역을 채웠습니다. 색을 다시 조정한 뒤 완료할 수 있습니다.';else $('status').textContent='원하는 색으로 영역을 색칠해 보세요.'}
async function boot(){renderPalette();loadDraft();try{const r=await fetch(SVG);if(!r.ok)throw Error('SVG HTTP '+r.status);$('canvas').innerHTML=await r.text();const outline=$('canvas').querySelector('#outline');if(outline)outline.style.pointerEvents='none';document.querySelectorAll('[data-region-id]').forEach(el=>{el.classList.add('region');el.style.pointerEvents='visiblePainted';el.setAttribute('fill',fills[el.dataset.regionId]||'#FFFFFF');el.addEventListener('pointerdown',e=>{e.preventDefault();paint(e.currentTarget)})});$('status').textContent='첫 번째 유효 영역을 클릭하면 활동 시간이 기록됩니다.';update()}catch(e){$('status').textContent='도안을 불러오지 못했습니다. 새로고침해 주세요.';$('status').className='error';console.error(e)}}
$('finish').onclick=()=>{if($('finish').disabled)return;done=true;localStorage.removeItem(KEY);$('status').textContent='활동이 완료되었습니다.';$('finish').disabled=true};boot();
</script><script src="completion-threshold.js"></script></body></html>
