<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PR-14 독립 색칠 검수</title><style>body{font-family:system-ui;margin:0;background:#f3f4f2;color:#172124}main{max-width:1100px;margin:auto;padding:16px}.layout{display:grid;grid-template-columns:minmax(300px,1fr) 320px;gap:16px}.stage{background:#fff;border:1px solid #bbb;border-radius:10px;overflow:auto;max-height:78vh;touch-action:none}.canvas{width:min(92vw,720px);min-width:300px;margin:auto;padding:12px}.canvas svg{display:block;width:100%;height:auto}.region{cursor:crosshair;pointer-events:visiblePainted}.panel{background:#fff;border:1px solid #bbb;border-radius:10px;padding:12px}.testcolor{padding:8px;border:2px solid transparent;border-radius:5px;cursor:pointer}.testcolor.active{border-color:#111}.log{font:12px ui-monospace,monospace;max-height:45vh;overflow:auto;white-space:pre-wrap}.note,.metric{font-size:13px;color:#4b5b5f;line-height:1.5}@media(max-width:720px){.layout{grid-template-columns:1fr}.panel{order:-1}}</style></head><body><main><h1>PR-14 영역 분할·독립 색칠 검수</h1><p class="note">각 영역에 임시 색을 적용하고, 서로 다른 두 영역의 색이 독립적으로 유지되는지 확인합니다.</p><div class="layout"><div class="stage"><div id="canvas" class="canvas"></div></div><aside class="panel"><div id="summary">SVG 로딩 중…</div><div id="metrics" class="metric"></div><p><button class="testcolor active" data-test-color="#397D78" style="background:#397D78;color:white">테스트 A</button> <button class="testcolor" data-test-color="#D4B85F" style="background:#D4B85F">테스트 B</button></p><p><button id="reset">초기화</button> <button id="clear">로그 지우기</button></p><div id="log" class="log"></div></aside></div></main><script>
const canvas=document.querySelector('#canvas'),log=document.querySelector('#log'),summary=document.querySelector('#summary'),metrics=document.querySelector('#metrics');let selectedTest='#397D78',clicks=0,colors=new Map();
function write(v){log.textContent=JSON.stringify(v)+'\n'+log.textContent}function update(){const v=[...colors.values()];metrics.textContent=`클릭 수: ${clicks} | 독립 색칠 영역: ${colors.size} | A: ${v.filter(x=>x==='#397D78').length} | B: ${v.filter(x=>x==='#D4B85F').length}`}
function apply(){const a=[...document.querySelectorAll('[data-region-id]')];let visible=0;colors.clear();a.forEach(x=>{x.setAttribute('fill','#fff');x.style.pointerEvents='visiblePainted';try{const b=x.getBBox();if(b.width>0&&b.height>0)visible++}catch{}});summary.textContent=`추출 요소: ${a.length}개 | 실제 렌더 영역: ${visible}개 | outline: ${document.querySelector('#outline')?'존재':'없음'}`;update()}
fetch('mandara3-regions.svg').then(r=>r.text()).then(t=>{canvas.innerHTML=t;apply();document.querySelectorAll('[data-region-id]').forEach(el=>el.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();const x=e.currentTarget,b=x.getBoundingClientRect();clicks++;x.setAttribute('fill',selectedTest);colors.set(x.dataset.regionId,selectedTest);update();write({event:'paint',regionId:x.dataset.regionId,fill:x.getAttribute('fill'),computedFill:getComputedStyle(x).fill,stroke:getComputedStyle(x).stroke,bbox:{x:Math.round(b.x),y:Math.round(b.y),w:Math.round(b.width),h:Math.round(b.height)}})}))}).catch(e=>summary.textContent='SVG 로딩 실패: '+e.message);
document.querySelectorAll('.testcolor').forEach(b=>b.onclick=()=>{selectedTest=b.dataset.testColor;document.querySelectorAll('.testcolor').forEach(x=>x.classList.toggle('active',x===b))});document.querySelector('#reset').onclick=()=>{clicks=0;apply()};document.querySelector('#clear').onclick=()=>log.textContent='';canvas.addEventListener('pointerdown',e=>{const h=document.elementFromPoint(e.clientX,e.clientY);if(!h?.dataset?.regionId)write({event:'hit-test-miss',hit:h?.tagName||null,regionId:null})});
</script></body></html>
