<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PR-14 만다라 컬러링</title><style>body{font-family:system-ui,sans-serif;max-width:960px;margin:auto;padding:18px;background:#f5f4f0;color:#243238}.card{background:#fff;padding:18px;border-radius:14px;margin:12px 0}.hidden{display:none}.toolbar{position:sticky;top:0;z-index:2;background:#f5f4f0ee;padding:10px 0}.palette{display:flex;flex-wrap:wrap;gap:8px}.swatch{width:42px;height:42px;border:3px solid transparent;border-radius:50%;cursor:pointer}.swatch[aria-pressed=true]{outline:3px solid #222;outline-offset:2px}.stage{background:#fff;border:1px solid #ccc;border-radius:12px;overflow:auto;max-height:65vh}.canvas{width:min(92vw,680px);margin:auto;padding:16px}.canvas svg{display:block;width:100%;height:auto}.region{cursor:pointer}.progress{height:10px;background:#ddd;border-radius:8px}.progress i{display:block;height:100%;background:#397D78;border-radius:8px;width:0}.muted{color:#59696d}.json{white-space:pre-wrap;background:#182427;color:#fff;padding:12px;overflow:auto}button{padding:9px 13px;border:1px solid #777;border-radius:7px;background:#fff;cursor:pointer;margin:4px}.primary{background:#397D78;color:#fff;border-color:#397D78}.status{min-height:1.5em}.error{color:#a33}</style></head><body><main>
<section id="intro" class="card"><h1>만다라 컬러링</h1><p>흰색 영역을 원하는 색으로 채워보세요. 첫 번째 색칠 영역을 누르면 활동 시간이 시작됩니다.</p><p class="muted">첫 도안이 자동으로 표시됩니다. 도안을 완성한 뒤 다른 도안으로 이어서 색칠하거나 활동을 마칠 수 있습니다.</p><p class="muted">권장 시간은 20분이며, 도안 하나 이상을 완성하고 16분 이상 활동하면 완료할 수 있습니다.</p><button id="begin" class="primary">도안 보기</button></section>
<section id="activity" class="hidden"><div class="toolbar"><b id="designName"></b><div id="status" class="status">흰색 영역을 클릭하면 활동 시간이 시작됩니다.</div><div class="palette" id="palette"></div><div><button id="undo">실행 취소</button><button id="reset">전체 초기화</button><button id="next">다음 도안</button><button id="finish" class="primary" disabled>완료</button></div><p><b id="elapsed">00:00</b> · 진행률 <b id="percent">0%</b> · 남은 시간 <b id="remaining">20:00</b></p><div class="progress"><i id="bar"></i></div><p class="muted">검은 선은 색칠 영역이 아닙니다. 색칠이 되지 않는 영역을 눌러도 활동 시간은 시작되지 않습니다.</p></div><div class="stage"><div class="canvas" id="canvas"></div></div></section>
<section id="result" class="card hidden"><h2>활동 결과</h2><p id="resultSummary"></p><pre id="json" class="json"></pre><button id="newActivity" class="primary">새 활동</button></section>
<script>
const KEY='lumi.pr14.coloring.v1';let runtime,protocol,example,state,selected='#397D78',undoStack=[];const $=id=>document.getElementById(id),fmt=s=>{s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
async function boot(){try{[protocol,runtime,example]=await Promise.all(['PR-14.proposed.json','pr14-runtime.json','pr14-result.example.json'].map(x=>fetch(x).then(r=>{if(!r.ok)throw Error(x+' HTTP '+r.status);return r.json()})));state=load()||{phase:'intro',elapsedSec:0,designs:{},completedDesigns:[],refreshCount:0};renderIntro()}catch(e){$('intro').innerHTML='<h1>도안을 불러오지 못했습니다.</h1><p class="error">네트워크 또는 파일 상태를 확인한 뒤 새로고침해 주세요.</p><p>'+e.message+'</p>'}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(!s)return null;if(s.phase==='active'&&s.startedAt){s.elapsedSec+=(Date.now()-s.startedAt)/1000;s.startedAt=null;s.phase='ready';s.refreshCount=(s.refreshCount||0)+1;s.devLog=(s.devLog||[]).concat({event:'REFRESH_PAUSED',at:new Date().toISOString()});localStorage.setItem(KEY,JSON.stringify(s))}return s}catch{return null}}
function renderIntro(){$('begin').onclick=()=>{state.phase='ready';save();show('activity');buildPalette();loadDesign()}}function show(id){['intro','activity','result'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}
function buildPalette(){const p=$('palette');p.innerHTML='';runtime.palette.forEach(c=>{const b=document.createElement('button');b.className='swatch';b.style.background=c.hex;b.title=c.name;b.setAttribute('aria-label',c.name);b.setAttribute('aria-pressed',c.hex===selected);b.onclick=()=>{selected=c.hex;[...p.children].forEach(x=>x.setAttribute('aria-pressed',x===b));$('status').textContent='선택 색상: '+c.name};p.append(b)})}
function chooseDesign(){const ids=runtime.designs.map(x=>x.id).filter(x=>x!==state.designId&&!state.completedDesigns.includes(x));return ids.length?ids[Math.floor(Math.random()*ids.length)]:runtime.designs.find(x=>x.id===state.designId)?.id||runtime.designs[0].id}
function loadDesign(){state.designId=state.designId||chooseDesign();state.designs[state.designId]=state.designs[state.designId]||{};undoStack=[];$('designName').textContent=runtime.designs.find(x=>x.id===state.designId).name;fetch(runtime.designs.find(x=>x.id===state.designId).svg).then(r=>{if(!r.ok)throw Error('SVG HTTP '+r.status);return r.text()}).then(t=>{const c=$('canvas');c.innerHTML=t;const outline=c.querySelector('#outline');if(outline)outline.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation()});c.querySelectorAll('[data-region-id]').forEach(el=>{const id=el.dataset.regionId;el.classList.add('region');el.style.pointerEvents='visiblePainted';el.setAttribute('fill',state.designs[state.designId][id]||'#FFFFFF');el.addEventListener('pointerdown',e=>paint(e.currentTarget))});update()}).catch(e=>{$('status').textContent='도안을 불러오지 못했습니다. 새로고침해 주세요.';$('status').className='status error'})}
function startIfNeeded(){if(state.phase==='ready'){state.phase='active';state.startedAt=Date.now();state.startTrigger='FIRST_REGION_CLICK';state.devLog=(state.devLog||[]).concat({event:'ACTIVITY_STARTED',at:new Date().toISOString()});save()}}
function paint(el){if(!el.dataset.regionId)return;startIfNeeded();const old=el.getAttribute('fill')||'#FFFFFF';if(old===selected)return;undoStack.push({id:el.dataset.regionId,old});el.setAttribute('fill',selected);state.designs[state.designId][el.dataset.regionId]=selected;save();update()}
function current(){return state.phase==='active'?state.elapsedSec+(Date.now()-state.startedAt)/1000:state.elapsedSec||0}
function update(){const all=[...document.querySelectorAll('[data-region-id]')],colored=all.filter(x=>(x.getAttribute('fill')||'').toUpperCase()!=='#FFFFFF').length,total=all.length,done=total>0&&colored===total;if(done&&!state.completedDesigns.includes(state.designId)){state.completedDesigns.push(state.designId);state.devLog=(state.devLog||[]).concat({event:'DESIGN_COMPLETED',designId:state.designId,at:new Date().toISOString()});save();$('status').textContent='도안을 완성했습니다. 다음 도안으로 이어서 색칠하거나 활동을 마칠 수 있습니다.'}const e=current(),p=Math.min(100,e/runtime.timer.planned_seconds*100),min=e>=runtime.timer.minimum_completion_seconds,can=state.completedDesigns.length>=1&&min;$('elapsed').textContent=fmt(e);$('percent').textContent=Math.round(p)+'%';$('remaining').textContent=fmt(Math.max(0,runtime.timer.planned_seconds-e));$('bar').style.width=p+'%';$('finish').disabled=!can;$('next').disabled=state.completedDesigns.length>=runtime.designs.length}
function undo(){const x=undoStack.pop();if(!x)return;const el=document.querySelector('[data-region-id="'+CSS.escape(x.id)+'"]');if(el){el.setAttribute('fill',x.old);state.designs[state.designId][x.id]=x.old;state.completedDesigns=state.completedDesigns.filter(x=>x!==state.designId);save();update()}}function reset(){document.querySelectorAll('[data-region-id]').forEach(el=>{el.setAttribute('fill','#FFFFFF');delete state.designs[state.designId][el.dataset.regionId]});state.completedDesigns=state.completedDesigns.filter(x=>x!==state.designId);undoStack=[];save();update()}function next(){const nextId=chooseDesign();state.designId=nextId;state.designs[nextId]={};state.completedDesigns=state.completedDesigns.filter(x=>x!==nextId);undoStack=[];save();loadDesign()}
function finish(){state.phase='result';state.elapsedSec=current();state.startedAt=null;state.completedAt=new Date().toISOString();save();const r={record_schema_version:example.record_schema_version,protocol_id:'PR-14',timer:{planned_seconds:runtime.timer.planned_seconds,elapsed_seconds:Math.round(state.elapsedSec),progress_percent:Math.min(100,state.elapsedSec/runtime.timer.planned_seconds*100),minimum_completion_seconds:runtime.timer.minimum_completion_seconds},designs:Object.entries(state.designs).map(([id,regions])=>({design_id:id,colored_region_count:Object.values(regions).filter(x=>x!=='#FFFFFF').length,completed:state.completedDesigns.includes(id)})),completion:{completed_design_count:state.completedDesigns.length,required_design_count:1,minimum_time_reached:state.elapsedSec>=runtime.timer.minimum_completion_seconds,completed_activity:true},start_trigger:{type:state.startTrigger},verification:{region_coloring:'ui_state_based',automatic_activity_verification:'not_performed'},storage:{source:'browser_local_storage',official_server_record:false}};$('resultSummary').textContent='완성 도안 '+state.completedDesigns.length+'개 · 경과 '+fmt(state.elapsedSec);$('json').textContent=JSON.stringify(r,null,2);show('result')}
$('undo').onclick=undo;$('reset').onclick=reset;$('next').onclick=next;$('finish').onclick=finish;$('newActivity').onclick=()=>{localStorage.removeItem(KEY);location.reload()};setInterval(()=>{if(state?.phase==='active')update()},500);boot();</script></main></body></html>
