name: 문서 작업
description: README, API 문서, 주석 등 문서를 추가하거나 수정합니다.
title: "[DOC] "
labels:
  - "📜 DOC"
body:
  - type: textarea
    id: content
    attributes:
      label: 작업 내용
      description: 어떤 문서를 추가하거나 수정하는지 설명해주세요.
      placeholder: 예) API 명세서에 인증 헤더 규칙을 추가합니다.
    validations:
      required: true

  - type: textarea
    id: purpose
    attributes:
      label: 작업 이유
      description: 왜 이 문서 작업이 필요한지 설명해주세요.
    validations:
      required: true

  - type: textarea
    id: target
    attributes:
      label: 대상 문서
      description: 작업 대상 파일이나 문서 링크를 나열해주세요.
      placeholder: |
        - README.md
        - docs/api.md
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: 체크리스트
      options:
        - label: 작업 내용과 이유를 충분히 설명하였는가?
        - label: 기존 문서와 일관성을 유지하였는가?
