name: 기타 수정
description: 설정 변경, 의존성 업데이트, 빌드 스크립트 수정 등 기타 작업을 합니다.
title: "[CHORE] "
labels:
  - "🔩 CHORE"
body:
  - type: textarea
    id: content
    attributes:
      label: 작업 내용
      description: 어떤 작업을 하는지 설명해주세요.
      placeholder: 예) Spring Boot 3.2 → 3.3 버전을 업그레이드합니다.
    validations:
      required: true

  - type: textarea
    id: purpose
    attributes:
      label: 작업 이유
      description: 왜 이 작업이 필요한지 설명해주세요.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 변경 범위
      description: 영향을 받는 파일, 설정, 환경 등을 나열해주세요.
      placeholder: |
        - build.gradle
        - .github/workflows/ci.yml
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: 체크리스트
      options:
        - label: 작업 내용과 이유를 충분히 설명하였는가?
        - label: 다른 환경(dev/prod)에 미치는 영향을 검토하였는가?
